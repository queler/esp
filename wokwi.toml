[wokwi]
version = 1
firmware = "./firmware/ESP32_GENERIC-20251209-v1.27.0.bin"
rfc2217ServerPort = 4000
elf = "./firmware/ESP32_GENERIC-20251209-v1.27.0.elf"
gdbServerPort=3333
# Forward http://localhost:8180 to port 80 on the simulated ESP32:
[[net.forward]]
from = "localhost:8166"
to = "target:8266"
[[net.forward]]
from = "localhost:8180"
to = "target:80"

